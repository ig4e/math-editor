<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Math Sheet</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/mathlive"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@cortex-js/compute-engine"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <!-- icon definitions, referenced via <use href="#icon-name"> -->
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-cursor" viewBox="0 0 24 24"><path d="M5 3l6 16 2.5-7L20 9.5z"/></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24"><path d="M14.5 4.5l5 5-10 10H4.5v-5z"/><path d="M12.5 6.5l5 5"/></symbol>
      <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M16 4l4 4-11 11H5v-4z"/><path d="M9 9l6 6"/></symbol>
      <symbol id="i-highlight" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 14h8" stroke-width="3"/></symbol>
      <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M20 20l-4.5-4.5M7.5 10.5h6M10.5 7.5v6"/></symbol>
      <symbol id="i-zoom-out" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M20 20l-4.5-4.5M7.5 10.5h6"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12m-5-5l5 5 5-5M4 20h16"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="8" cy="9" r="1.5"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M10 11v6M14 11v6"/></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M12 20h9M4 20v-4l11-11 4 4-11 11z"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="3" width="13" height="13" rx="2"/><path d="M16 16v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h3"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-fx" viewBox="0 0 24 24"><path d="M5 19V8a3 3 0 0 1 3-3h2M5 12h6M14 9l5 10M14 19l5-10" stroke-linecap="round"/></symbol>
      <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 5h14M12 5v14M9 19h6"/></symbol>
      <symbol id="i-eval" viewBox="0 0 24 24"><path d="M4 9h10M4 15h10"/><path d="M16 8l5 4-5 4z" fill="currentColor" stroke="none"/></symbol>
    </defs>
  </svg>

  <header class="toolbar" id="toolbar">
    <div class="group">
      <button data-action="add-math" title="Add equation (E)"><svg class="ic"><use href="#i-fx"/></svg><span>Math</span></button>
      <button data-action="add-text" title="Add note (T)"><svg class="ic"><use href="#i-text"/></svg><span>Text</span></button>
    </div>

    <div class="group" role="radiogroup" aria-label="Tool">
      <button data-tool="move"   class="tool active" title="Move / select (V)"><svg class="ic"><use href="#i-cursor"/></svg></button>
      <button data-tool="pen"    class="tool"        title="Pen (P)"><svg class="ic"><use href="#i-pen"/></svg></button>
      <button data-tool="eraser" class="tool"        title="Eraser (X)"><svg class="ic"><use href="#i-eraser"/></svg></button>
    </div>

    <div class="group">
      <button data-action="evaluate" title="Evaluate / solve selection (=)"><svg class="ic"><use href="#i-eval"/></svg><span>Solve</span></button>
    </div>

    <div class="group" id="palette" aria-label="Color">
      <button class="swatch active" data-color="black"  style="--c:#111111" title="Black"></button>
      <button class="swatch"        data-color="red"    style="--c:#e11d48" title="Red"></button>
      <button class="swatch"        data-color="blue"   style="--c:#2563eb" title="Blue"></button>
      <button class="swatch"        data-color="green"  style="--c:#16a34a" title="Green"></button>
      <button class="swatch"        data-color="orange" style="--c:#ca8a04" title="Orange"></button>
      <button class="swatch"        data-color="purple" style="--c:#9333ea" title="Purple"></button>
      <button data-action="highlight-box" title="Highlight selection"><svg class="ic"><use href="#i-highlight"/></svg></button>
    </div>

    <div class="group">
      <button data-action="zoom-out" title="Zoom out (−)"><svg class="ic"><use href="#i-zoom-out"/></svg></button>
      <span class="zoom-label" id="zoom-label">100%</span>
      <button data-action="zoom-in"  title="Zoom in (+)"><svg class="ic"><use href="#i-zoom-in"/></svg></button>
      <button data-action="reset-view" title="Reset view (0)"><svg class="ic"><use href="#i-home"/></svg></button>
    </div>

    <div class="group">
      <button data-action="save"  title="Download .mathsheet"><svg class="ic"><use href="#i-download"/></svg></button>
      <button data-action="open"  title="Open .mathsheet"><svg class="ic"><use href="#i-folder"/></svg></button>
      <button data-action="png"   title="Export PNG"><svg class="ic"><use href="#i-image"/></svg></button>
      <button data-action="clear" title="Clear sheet"><svg class="ic"><use href="#i-trash"/></svg></button>
    </div>

    <div class="group spacer">
      <span class="hint" id="hint">Drag to pan · scroll to zoom · Ctrl+Enter solves the selection</span>
    </div>
  </header>

  <main class="viewport" id="viewport">
    <div class="world" id="world">
      <svg class="overlay" id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="blocks" id="blocks"></div>
    </div>
  </main>

  <input type="file" id="file-input" accept=".mathsheet,.json,application/json" hidden />
</body>
</html>
